<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#FFD700"/>
  <title>CJX — ตั้ง PIN ครั้งแรก</title>
  <style>
    *{-webkit-box-sizing:border-box;box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;margin:0;padding:0;background:#E8D96A;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow:hidden}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    #root{width:100%;height:100%;height:100dvh;display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center}
    input{-webkit-appearance:none;appearance:none;outline:none}
    button{-webkit-appearance:none;appearance:none;outline:none}
    @-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}20%,60%{-webkit-transform:translateX(-8px)}40%,80%{-webkit-transform:translateX(8px)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    @-webkit-keyframes fadeIn{0%{opacity:0;-webkit-transform:translateY(12px)}100%{opacity:1;-webkit-transform:translateY(0)}}
    @keyframes fadeIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
    @-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .anim-shake{-webkit-animation:shake .4s ease;animation:shake .4s ease}
    .anim-in{-webkit-animation:fadeIn .4s ease both;animation:fadeIn .4s ease both}
    .spinner{-webkit-animation:spin .8s linear infinite;animation:spin .8s linear infinite}
    @media screen and (min-width:768px){.phone-shell{width:100%;max-width:768px;height:100vh;height:100dvh;border-radius:0;overflow:hidden;-webkit-box-shadow:0 0 60px rgba(0,0,0,0.15);box-shadow:0 0 60px rgba(0,0,0,0.15)}}
    @media screen and (min-width:1024px){.phone-shell{max-width:768px;border-radius:24px;-webkit-box-shadow:0 8px 60px rgba(0,0,0,0.2);box-shadow:0 8px 60px rgba(0,0,0,0.2)}}
  </style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script type="text/babel">
const { useState, useCallback } = React;

const C = {
  yellow:"#FFD700",yellowPale:"#FFF4CC",yellowBorder:"#FFE87A",yellowBg:"#FFF9E6",
  green:"#1A9E6A",greenBg:"#E6F7F0",greenBorder:"#A3DFC5",
  red:"#D13E3E",redBg:"#FDEAEA",redBorder:"#F5AAAA",
  ink:"#1C1800",inkMid:"#5C4500",inkLight:"#8a6b00",
  muted:"#B0A070",border:"#F0E8C8",white:"#FFFFFF",cream:"#F0E8C8",
};

const SESSION_USER = (function(){
  try{ return JSON.parse(sessionStorage.getItem("cjx_user")||"null"); }
  catch(e){ return null; }
})();

function PinDot({ filled }){
  return (
    <div style={{width:14,height:14,borderRadius:"50%",
      background:filled?C.ink:"transparent",
      border:"2px solid "+(filled?C.ink:"rgba(0,0,0,0.25)"),
      WebkitTransition:"all .2s cubic-bezier(0.34,1.56,0.64,1)",
      transition:"all .2s cubic-bezier(0.34,1.56,0.64,1)",
      WebkitTransform:filled?"scale(1.15)":"scale(1)",
      transform:filled?"scale(1.15)":"scale(1)"}}/>
  );
}

function NumPad({ onPress, onDelete }){
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"];
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",rowGap:10,columnGap:10}}>
      {keys.map((k,i)=>(
        <button key={i} onClick={()=>k==="⌫"?onDelete():k?onPress(k):null} disabled={!k}
          style={{height:56,borderRadius:14,fontSize:k==="⌫"?20:22,fontWeight:500,
            background:k?C.white:"transparent",color:k==="⌫"?C.inkLight:C.ink,
            border:k?"1px solid "+C.border:"none",cursor:k?"pointer":"default",
            display:"flex",alignItems:"center",justifyContent:"center",
            WebkitAppearance:"none",appearance:"none",WebkitTapHighlightColor:"transparent",
            WebkitBoxShadow:k?"0 1px 4px rgba(0,0,0,0.06)":"none",
            boxShadow:k?"0 1px 4px rgba(0,0,0,0.06)":"none"}}>
          {k==="⌫"?<i className="ti ti-backspace"/>:k}
        </button>
      ))}
    </div>
  );
}

function App(){
  const [step,setStep]         = useState("new");  // new | confirm | saving | done
  const [newPin,setNewPin]     = useState("");
  const [confirmPin,setConfirmPin] = useState("");
  const [error,setError]       = useState("");
  const [shakeKey,setShakeKey] = useState(0);

  const shake = useCallback(()=>setShakeKey(k=>k+1),[]);

  const handleNewPress = useCallback((d)=>{
    if(newPin.length>=4) return;
    const next=newPin+d; setNewPin(next); setError("");
    if(next.length===4) setTimeout(()=>setStep("confirm"),80);
  },[newPin]);

  const handleConfirmPress = useCallback((d)=>{
    if(confirmPin.length>=4) return;
    const next=confirmPin+d; setConfirmPin(next); setError("");
    if(next.length===4){
      setTimeout(()=>{
        if(next===newPin){
          setStep("saving");
          if(SESSION_USER){
            SESSION_USER.pin = next;
            SESSION_USER.isFirstLogin = false;
            sessionStorage.setItem("cjx_user",JSON.stringify(SESSION_USER));
          }
          setTimeout(()=>setStep("done"),1000);
        } else {
          setConfirmPin(""); setError("PIN ไม่ตรงกัน กรุณาลองใหม่"); shake();
        }
      },80);
    }
  },[confirmPin,newPin,shake]);

  const userName = SESSION_USER?.name?.split(" ")[0] || "พนักงานใหม่";

  if(step==="saving"||step==="done"){
    return (
      <div className="phone-shell" style={{
        background:C.cream,display:"flex",flexDirection:"column",
        width:"100%",height:"100vh",height:"100dvh",overflow:"hidden",
        alignItems:"center",justifyContent:"center"}}>
        {step==="saving" ? (
          <div style={{textAlign:"center"}}>
            <div style={{width:64,height:64,borderRadius:"50%",background:C.yellow,
              display:"flex",alignItems:"center",justifyContent:"center",
              margin:"0 auto 20px",
              WebkitBoxShadow:"0 4px 20px rgba(180,140,0,0.3)",
              boxShadow:"0 4px 20px rgba(180,140,0,0.3)"}}>
              <i className="spinner ti ti-loader" style={{fontSize:28,color:C.ink}}/>
            </div>
            <div style={{fontSize:16,fontWeight:500,color:C.ink}}>กำลังบันทึก PIN...</div>
          </div>
        ) : (
          <div className="anim-in" style={{textAlign:"center",padding:"0 32px"}}>
            <div style={{width:80,height:80,borderRadius:"50%",background:C.greenBg,
              border:"2px solid "+C.greenBorder,
              display:"flex",alignItems:"center",justifyContent:"center",
              margin:"0 auto 20px"}}>
              <i className="ti ti-check" style={{fontSize:40,color:C.green}}/>
            </div>
            <div style={{fontSize:20,fontWeight:500,color:C.ink,marginBottom:8}}>ตั้ง PIN สำเร็จ!</div>
            <div style={{fontSize:14,color:C.muted,marginBottom:8}}>ยินดีต้อนรับ {userName}</div>
            <div style={{fontSize:13,color:C.muted,marginBottom:36}}>คุณสามารถเริ่มใช้งานระบบได้แล้ว</div>
            <button onClick={()=>window.location.assign("cjx_shift.html")}
              style={{padding:"14px 48px",fontSize:15,fontWeight:500,
                background:C.yellow,color:C.ink,border:"none",borderRadius:14,
                cursor:"pointer",WebkitAppearance:"none",appearance:"none",
                WebkitTapHighlightColor:"transparent",minHeight:52,
                WebkitBoxShadow:"0 4px 16px rgba(180,140,0,0.3)",
                boxShadow:"0 4px 16px rgba(180,140,0,0.3)"}}>
              เริ่มใช้งาน
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="phone-shell" style={{
      background:C.cream,position:"relative",
      display:"flex",flexDirection:"column",
      width:"100%",height:"100vh",height:"100dvh",overflow:"hidden"}}>

      {/* HEADER */}
      <div style={{background:C.cream,flexShrink:0,padding:"8px 10px 0"}}>
        <div style={{background:C.yellow,borderRadius:"20px 20px 0 0",overflow:"hidden",
          WebkitBoxShadow:"0 4px 16px rgba(180,140,0,0.20)",
          boxShadow:"0 4px 16px rgba(180,140,0,0.20)",
          padding:"20px 20px 16px"}}>
          <div style={{display:"flex",alignItems:"center"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:500,color:"rgba(0,0,0,0.4)",letterSpacing:.5,textTransform:"uppercase",marginBottom:3}}>
                CJX Operations · ยินดีต้อนรับ
              </div>
              <div style={{fontSize:20,fontWeight:500,color:C.ink,lineHeight:1.2}}>
                {step==="new"?"ตั้ง PIN ครั้งแรก":"ยืนยัน PIN ของคุณ"}
              </div>
              <div style={{fontSize:13,color:"rgba(0,0,0,0.45)",marginTop:3}}>สวัสดี {userName} 👋</div>
            </div>
            <div style={{width:48,height:48,borderRadius:14,background:C.ink,
              display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontSize:16,fontWeight:500,color:C.yellow,letterSpacing:-1}}>CJX</span>
            </div>
          </div>
        </div>
      </div>

      {/* CARD */}
      <div style={{background:C.cream,flexShrink:0,padding:"0 10px"}}>
        <div style={{background:C.white,padding:"20px 20px 16px",
          WebkitBoxShadow:"0 2px 8px rgba(0,0,0,0.06)",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          {/* info banner */}
          <div style={{background:C.yellowPale,border:"1px solid "+C.yellowBorder,
            borderRadius:10,padding:"10px 12px",marginBottom:16,
            display:"flex",alignItems:"flex-start"}}>
            <i className="ti ti-info-circle" style={{fontSize:16,color:C.inkLight,marginRight:8,marginTop:1,flexShrink:0}}/>
            <div style={{fontSize:12,color:C.inkLight,lineHeight:1.5}}>
              {step==="new"
                ? "กรุณาตั้ง PIN 4 หลักสำหรับเข้าสู่ระบบ จำ PIN ให้ดีและอย่าบอกผู้อื่น"
                : "กรอก PIN เดิมอีกครั้งเพื่อยืนยัน"}
            </div>
          </div>

          {/* step indicator */}
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",marginBottom:16}}>
            {["ตั้ง PIN","ยืนยัน"].map((s,i)=>{
              const isActive = (step==="new"&&i===0)||(step==="confirm"&&i===1);
              const isDone   = step==="confirm"&&i===0;
              return (
                <div key={i} style={{display:"flex",alignItems:"center"}}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                    <div style={{width:28,height:28,borderRadius:"50%",
                      background:isDone?C.green:isActive?C.yellow:"#F0E8C8",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:13,fontWeight:500,
                      color:isDone?"#fff":isActive?C.ink:C.muted}}>
                      {isDone?<i className="ti ti-check" style={{fontSize:13}}/>:i+1}
                    </div>
                    <div style={{fontSize:12,color:isActive?C.inkLight:C.muted,marginTop:4}}>{s}</div>
                  </div>
                  {i<1&&<div style={{width:40,height:1,background:C.border,margin:"0 8px",marginBottom:16}}/>}
                </div>
              );
            })}
          </div>

          {/* pin dots */}
          <div key={shakeKey} className={error?"anim-shake":""}
            style={{display:"flex",justifyContent:"center",marginBottom:error?8:0}}>
            <div style={{display:"flex",rowGap:16,columnGap:16}}>
              {[0,1,2,3].map(i=>(
                <PinDot key={i} filled={i<(step==="new"?newPin.length:confirmPin.length)}/>
              ))}
            </div>
          </div>
          {error && (
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",
              marginTop:8,fontSize:12,color:C.red}}>
              <i className="ti ti-alert-circle" style={{fontSize:14,marginRight:4}}/>
              {error}
            </div>
          )}
        </div>
      </div>

      {/* NUMPAD */}
      <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",
        justifyContent:"center",padding:"12px 20px 8px",background:C.cream}}>
        <NumPad
          onPress={step==="new"?handleNewPress:handleConfirmPress}
          onDelete={step==="new"?()=>setNewPin(p=>p.slice(0,-1)):()=>setConfirmPin(p=>p.slice(0,-1))}
        />
        {step==="confirm" && (
          <div style={{textAlign:"center",marginTop:12}}>
            <button onClick={()=>{setStep("new");setNewPin("");setConfirmPin("");setError("");}}
              style={{fontSize:12,color:C.muted,background:"transparent",border:"none",
                WebkitAppearance:"none",appearance:"none",WebkitTapHighlightColor:"transparent",
                cursor:"pointer",display:"inline-flex",alignItems:"center"}}>
              <i className="ti ti-arrow-left" style={{fontSize:13,marginRight:4}}/>
              ตั้ง PIN ใหม่อีกครั้ง
            </button>
          </div>
        )}
      </div>

      {/* FOOTER */}
      <div style={{flexShrink:0,padding:"6px 10px 14px",textAlign:"center",background:C.cream}}>
        <div style={{fontSize:12,color:C.muted}}>CJX Operations · ปลอดภัยและเข้ารหัสทุกครั้ง</div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
